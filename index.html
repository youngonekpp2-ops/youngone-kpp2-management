<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#edf2f7;color:#222}
.hidden{display:none!important}
header{background:#073b70;color:white;padding:15px;text-align:center}
header h2{margin:0;font-size:20px}
.page{width:100%;max-width:850px;margin:20px auto;padding:12px}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 3px 12px #0002}
.center{text-align:center}
button{border:0;border-radius:7px;padding:11px 15px;background:#0756a5;color:white;font-size:15px;cursor:pointer}
button:active{opacity:.8}
input,textarea{width:100%;padding:11px;margin:6px 0 13px;border:1px solid #bbb;border-radius:6px;font-size:15px;font-family:Arial,sans-serif}
label{font-weight:bold;font-size:14px}
.primary{width:100%;margin-top:8px}
.secondary{background:#555}
.success{background:#16813d}
.danger{background:#c62828}
.info{background:#087e9c}
.small-btn{padding:7px 10px;font-size:13px;margin:2px}
.message{color:#c62828;font-size:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:15px}
.topbar h2,.topbar h3{margin:0}
.option-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin:20px 0}
.option{min-height:105px;display:flex;align-items:center;justify-content:center;text-align:center;padding:15px;font-weight:bold;font-size:17px;border-radius:10px;box-shadow:0 3px 8px #0002}
.manpower{background:#1769aa}
.production{background:#16834a}
.maintenance{background:#c47a16}
.notice-box{border:1px solid #ddd;border-radius:9px;padding:15px;margin-top:20px;background:#fffdf5}
.notice-heading{background:#073b70;color:white;padding:12px;border-radius:6px;margin:0 0 12px}
.notice-item{border-bottom:1px solid #ddd;padding:12px 4px;overflow-wrap:anywhere}
.notice-date{font-size:12px;color:#777;margin-top:5px}
.table-wrap{width:100%;overflow-x:auto;margin-top:15px}
table{border-collapse:collapse;width:100%;min-width:650px;background:white}
th,td{border:1px solid #ccc;padding:9px;text-align:left;font-size:13px}
th{background:#0756a5;color:white}
.report-title{background:#dcecff;padding:11px;margin-top:22px;border-radius:6px}
.old-title{background:#eee;padding:10px;margin-top:20px;border-radius:6px}
#dashboard{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;background:#101820;z-index:20;overflow:hidden}
#dashboardImageFrame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100vw;aspect-ratio:16/9}
#dashboardImage{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.hotspot{position:absolute;z-index:3;background:transparent;border:0;padding:0;margin:0}
#hotSizing{left:20.3%;top:41.2%;width:13.8%;height:20%}
#hotDrawing{left:35.7%;top:41.2%;width:13.8%;height:20%}
#hotWeaving{left:51.2%;top:41.2%;width:13.8%;height:20%}
#hotDyer{left:66.7%;top:41.2%;width:13.8%;height:20%}
#hotInspection{left:82%;top:41.2%;width:13.8%;height:20%}
#menuSizing{left:2%;top:20.5%;width:16%;height:5%}
#menuDrawing{left:2%;top:26.2%;width:16%;height:5%}
#menuWeaving{left:2%;top:31.8%;width:16%;height:5%}
#menuDyer{left:2%;top:37.5%;width:16%;height:5%}
#menuInspection{left:2%;top:43%;width:16%;height:5%}
#menuReport{left:2%;top:50.5%;width:16%;height:6%}
@media(max-width:600px){
.page{margin:10px auto;padding:9px}
.card{padding:15px}
header h2{font-size:17px}
.option-grid{grid-template-columns:1fr}
.option{min-height:75px}
}
</style>

<script>

const accounts = {

},

},
Weaving:{

adminEmail:"weavingadmin@youngone-kpp-2.invalid"
},
Dyer:{

},
Inspection:{

adminEmail:"inspectionadmin@youngone-kpp-2.invalid"
}
};

const sections=["Sizing","Drawing","Weaving","Dyer","Inspection"];
const categories=["Manpower","Production","Maintenance"];

let selectedSection="";
let currentSection="";
let currentRole="";
let currentCategory="";
let noticeUnsubscribe=null;
let cloudNotices=[];

function getRecords(){
try{return JSON.parse(localStorage.getItem("youngone_kpp2_records"))||[];}
catch(e){return [];}
}

function getOldNotices(){
try{return JSON.parse(localStorage.getItem("youngone_kpp2_notices"))||[];}
catch(e){return [];}
}

function stopNoticeListener(){
if(noticeUnsubscribe){noticeUnsubscribe();noticeUnsubscribe=null;}
}

function hideAllPages(){
[
"mainLoginPage","dashboard","sectionLoginPage",
"sectionHomePage","categoryPage","reportLoginPage","reportPage"
].forEach(id=>document.getElementById(id).classList.add("hidden"));
document.getElementById("mainHeader").classList.remove("hidden");
document.body.style.overflow="auto";
}

function showDashboard(){
stopNoticeListener();
hideAllPages();
document.getElementById("dashboard").classList.remove("hidden");
document.getElementById("mainHeader").classList.add("hidden");
document.body.style.overflow="hidden";
fitDashboardImage();
}

function fitDashboardImage(){
const img=document.getElementById("dashboardImage");
const frame=document.getElementById("dashboardImageFrame");
function resizeFrame(){
if(!img.naturalWidth||!img.naturalHeight)return;
const ratio=img.naturalWidth/img.naturalHeight;
const sw=window.innerWidth;
const sh=window.innerHeight;
let width=sw;
let height=width/ratio;
if(height>sh){height=sh;width=height*ratio;}
frame.style.width=width+"px";
frame.style.height=height+"px";
frame.style.aspectRatio=ratio;
}
if(img.complete)resizeFrame();
else img.onload=resizeFrame;
}

window.addEventListener("resize",()=>{
if(!document.getElementById("dashboard").classList.contains("hidden"))fitDashboardImage();
});

async function firebaseLogin(email,password){
await auth.signOut();
return await auth.signInWithEmailAndPassword(email,password);
}

function showLoginError(error){
console.error(error);
if(error.code==="auth/invalid-email")return "Firebase Email ঠিক নেই। অ্যাকাউন্টের Email আবার পরীক্ষা করুন।";
if(error.code==="auth/user-not-found"||error.code==="auth/wrong-password"||error.code==="auth/invalid-credential")return "ভুল User ID অথবা Password!";
if(error.code==="auth/too-many-requests")return "অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পর আবার চেষ্টা করুন।";
if(error.code==="auth/unauthorized-domain")return "এই ওয়েবসাইটের ডোমেইন Firebase-এ অনুমোদিত নয়।";
if(error.code==="auth/network-request-failed")return "ইন্টারনেট সংযোগ পরীক্ষা করুন।";
return "Login করা যায়নি। Firebase অ্যাকাউন্ট ও ইন্টারনেট পরীক্ষা করুন।";
}

async function mainLogin(){
const user=document.getElementById("mainUser").value.trim();
const pass=document.getElementById("mainPass").value;
const msg=document.getElementById("mainMessage");
msg.innerText="লগইন হচ্ছে...";
if(user!=="Youngone"||pass!=="Youngone"){
msg.innerText="Wrong User ID or Password!";
return;
}
try{
await firebaseLogin("main@youngone-kpp-2.invalid","Youngone");
msg.innerText="";
showDashboard();
}catch(error){msg.innerText=showLoginError(error);}
}

function openSection(section){
selectedSection=section;
hideAllPages();
document.getElementById("sectionLoginPage").classList.remove("hidden");
document.getElementById("sectionLoginTitle").innerText=section+" Section Login";
document.getElementById("sectionUser").value="";
document.getElementById("sectionPass").value="";
document.getElementById("sectionMessage").innerText="";
}

async function sectionLogin(){
const user=document.getElementById("sectionUser").value.trim();
const pass=document.getElementById("sectionPass").value;
const account=accounts[selectedSection];
const msg=document.getElementById("sectionMessage");
let email="";
if(user===account.user&&pass===account.pass){
email=account.email;
currentRole="Data Entry";
}else if(user===account.adminUser&&pass===account.adminPass){
email=account.adminEmail;
currentRole="Admin";
}else{
msg.innerText="Wrong User ID or Password!";
return;
}
msg.innerText="লগইন হচ্ছে...";
try{
await firebaseLogin(email,pass);
currentSection=selectedSection;
msg.innerText="";
openSectionHome();
}catch(error){msg.innerText=showLoginError(error);}
}

function openSectionHome(){
stopNoticeListener();
hideAllPages();
document.getElementById("sectionHomePage").classList.remove("hidden");
document.getElementById("sectionHomeTitle").innerText=currentSection.toUpperCase()+" SECTION";
document.getElementById("sectionRoleText").innerText="Login Type: "+currentRole;
document.getElementById("manpowerLabel").innerText=currentSection.toUpperCase()+" MANPOWER";
document.getElementById("productionLabel").innerText=currentSection.toUpperCase()+" PRODUCTION";
document.getElementById("maintenanceLabel").innerText=currentSection.toUpperCase()+" MAINTENANCE";
document.getElementById("noticeAdminForm").classList.toggle("hidden",currentRole!=="Admin");
document.getElementById("noticeText").value="";
listenNotices();
}

function openCategory(category){
currentCategory=category;
hideAllPages();
document.getElementById("categoryPage").classList.remove("hidden");
document.getElementById("categoryHeading").innerText=currentSection.toUpperCase()+" "+category.toUpperCase();
}

function backToSectionHome(){openSectionHome();}

function listenNotices(){
stopNoticeListener();
const list=document.getElementById("noticeList");
list.innerHTML="<p>নোটিশ লোড হচ্ছে...</p>";
noticeUnsubscribe=db.collection("notices")
.where("section","==",currentSection)
.onSnapshot(snapshot=>{
cloudNotices=[];
snapshot.forEach(doc=>cloudNotices.push({id:doc.id,...doc.data()}));
renderNotices();
},error=>{
console.error(error);
list.innerHTML="<p class='message'>নোটিশ লোড করা যায়নি। Firebase Rules পরীক্ষা করুন।</p>";
});
}

async function addNotice(){
if(currentRole!=="Admin"){alert("Only Admin can publish notices.");return;}
const text=document.getElementById("noticeText").value.trim();
if(!text){alert("Please write a notice.");return;}
try{
await db.collection("notices").add({
section:currentSection,
text:text,
date:new Date().toLocaleString(),
createdAt:firebase.firestore.FieldValue.serverTimestamp()
});
document.getElementById("noticeText").value="";
alert("Notice Published!");
}catch(error){
console.error(error);
alert("নোটিশ প্রকাশ করা যায়নি। Admin অনুমতি ও ইন্টারনেট পরীক্ষা করুন।");
}
}

function renderNotices(){
const oldNotices=getOldNotices().filter(n=>n.section===currentSection);
const combined=[
...cloudNotices.map(n=>({...n,isOld:false})),
...oldNotices.map(n=>({...n,isOld:true}))
];
combined.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
const list=document.getElementById("noticeList");
list.innerHTML="";
if(combined.length===0){list.innerHTML="<p>No Notice Available.</p>";return;}
combined.forEach(notice=>{
const item=document.createElement("div");
item.className="notice-item";
const text=document.createElement("div");
text.textContent=notice.text||notice.message||"";
const date=document.createElement("div");
date.className="notice-date";
date.textContent=notice.date||"";
item.append(text,date);
if(currentRole==="Admin"&&!notice.isOld){
const edit=document.createElement("button");
edit.className="small-btn";
edit.textContent="Edit";
edit.onclick=()=>editNotice(notice.id);
const del=document.createElement("button");
del.className="small-btn danger";
del.textContent="Delete";
del.onclick=()=>deleteNotice(notice.id);
item.append(edit,del);
}
list.appendChild(item);
});
}

async function editNotice(id){
if(currentRole!=="Admin")return;
const notice=cloudNotices.find(n=>n.id===id);
if(!notice)return;
const updated=prompt("Edit Notice:",notice.text);
if(updated===null)return;
if(!updated.trim()){alert("Notice cannot be empty.");return;}
try{
await db.collection("notices").doc(id).update({
text:updated.trim(),
date:new Date().toLocaleString()
});
}catch(error){console.error(error);alert("নোটিশ সম্পাদনা করা যায়নি।");}
}

async function deleteNotice(id){
if(currentRole!=="Admin")return;
if(!confirm("Delete this notice?"))return;
try{await db.collection("notices").doc(id).delete();}
catch(error){console.error(error);alert("নোটিশ মুছে ফেলা যায়নি।");}
}

function openReportLogin(){
hideAllPages();
document.getElementById("reportLoginPage").classList.remove("hidden");
document.getElementById("reportUser").value="";
document.getElementById("reportPass").value="";
document.getElementById("reportMessage").innerText="";
}

async function reportLogin(){
const user=document.getElementById("reportUser").value.trim();
const pass=document.getElementById("reportPass").value;
const msg=document.getElementById("reportMessage");
if(user!=="Report"||pass!=="Report@123"){
msg.innerText="Wrong User ID or Password!";
return;
}
msg.innerText="লগইন হচ্ছে...";
try{
await firebaseLogin("report@youngone-kpp-2.invalid","Report@123");
msg.innerText="";
await showAllReports();
}catch(error){msg.innerText=showLoginError(error);}
}

async function showAllReports(){
hideAllPages();
document.getElementById("reportPage").classList.remove("hidden");
const container=document.getElementById("allReports");
container.innerHTML="<p>রিপোর্ট লোড হচ্ছে...</p>";
try{
const snapshot=await db.collection("notices").get();
const cloudReportNotices=[];
snapshot.forEach(doc=>cloudReportNotices.push({id:doc.id,...doc.data()}));
const oldNotices=getOldNotices();
const notices=[...cloudReportNotices,...oldNotices];
renderAllReports(container,getRecords(),notices);
}catch(error){
console.error(error);
container.innerHTML="<p class='message'>রিপোর্ট লোড করা যায়নি। ইন্টারনেট ও Firebase Rules পরীক্ষা করুন।</p>";
}
}

function renderAllReports(container,records,notices){
container.innerHTML="";
sections.forEach(section=>{
categories.forEach(category=>{
const title=document.createElement("h3");
title.className="report-title";
title.textContent=section.toUpperCase()+" "+category.toUpperCase()+" REPORT";
container.appendChild(title);
const selected=records.filter(r=>r.section===section&&r.category===category);
addReportTable(container,selected);
});
const oldRecords=records.filter(r=>r.section===section&&!r.category);
if(oldRecords.length){
const oldTitle=document.createElement("h3");
oldTitle.className="old-title";
oldTitle.textContent=section+" PREVIOUS RECORDS";
container.appendChild(oldTitle);
addReportTable(container,oldRecords);
}
const noticeTitle=document.createElement("h3");
noticeTitle.className="report-title";
noticeTitle.textContent=section.toUpperCase()+" NOTICE BOARD";
container.appendChild(noticeTitle);
const sectionNotices=notices.filter(n=>n.section===section);
if(sectionNotices.length===0){
const p=document.createElement("p");
p.textContent="No Notice Available.";
container.appendChild(p);
}else{
sectionNotices.slice().reverse().forEach(n=>{
const p=document.createElement("p");
p.style.padding="10px";
p.style.borderBottom="1px solid #ddd";
p.textContent=(n.text||n.message||"")+" — "+(n.date||"");
container.appendChild(p);
});
}
});
}

function addReportTable(container,selected){
const wrapper=document.createElement("div");
wrapper.className="table-wrap";
const table=document.createElement("table");
table.innerHTML=`
<thead><tr>
<th>Date</th><th>Machine No.</th><th>Item / Description</th>
<th>Quantity</th><th>Remarks</th>
</tr></thead><tbody></tbody>`;
const tbody=table.querySelector("tbody");
if(selected.length===0){
tbody.innerHTML='<tr><td colspan="5">No Data Found</td></tr>';
}else{
selected.slice().reverse().forEach(record=>{
const tr=document.createElement("tr");
[record.date,record.machine,record.item,record.quantity,record.remarks].forEach(value=>{
const td=document.createElement("td");
td.textContent=value??"";
tr.appendChild(td);
});
tbody.appendChild(tr);
});
}
wrapper.appendChild(table);
container.appendChild(wrapper);
}

async function logoutToDashboard(){
stopNoticeListener();
currentSection="";
currentRole="";
currentCategory="";
